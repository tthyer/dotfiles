# Ghostty bottom-bar shim — tmux exists here only to paint a 2-row status bar.
# Ghostty still owns tabs/splits; tmux stays out of the way.
# Kill switch:  touch ~/.config/tmux/DISABLED   (next new window = plain bash)
# Uninstall:    bash ~/.config/tmux/uninstall-bar.sh

# Run an interactive login bash in each pane (matches ghostty-bash behavior).
set -g default-command "/opt/homebrew/bin/bash --login"

set -g prefix None
unbind-key -a
set -g mouse off
set -g status on
set -g status 2                 # two stacked rows
set -g status-interval 5
set -g status-position bottom
set -g escape-time 10
set -g focus-events on
setw -g window-status-current-format ''
setw -g window-status-format ''

# Brand palette: #054A91 deep blue, #3E7CB1 mid blue, #7DC1F1 light, #02BD9D teal
set -g status-style "bg=#0b1f33,fg=#7DC1F1"

# Row 0 (upper): repo/worktree on the left; amp env + kube + azure on the right
set -g status-format[0] "#[bg=#054A91,fg=#ffffff,bold] #(~/.config/tmux/bar.sh repo '#{pane_current_path}') #[bg=#0b1f33]#[align=right]#[fg=#E8C547,bold]#(~/.config/tmux/bar.sh amp '#{pane_id}')  #[fg=#02BD9D,nobold]#(~/.config/tmux/bar.sh kube)  #[fg=#3E7CB1]#(~/.config/tmux/bar.sh az) "

# Row 1 (lower): Claude model+ctx on the left; host + UTC clock on the right
set -g status-format[1] "#[fg=#7DC1F1] 🤖 #(~/.config/tmux/bar.sh claude '#{pane_id}')#[align=right]#[fg=#3E7CB1]#H  #[fg=#7DC1F1]#(date -u +%H:%MZ) UTC "
