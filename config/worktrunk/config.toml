# Worktrunk User Configuration
#
# Project entries are machine- and work-specific; they live in the private
# overlay and are appended to this file by its apply.sh. Edit the overlay,
# not the generated ~/.config/worktrunk/config.toml.

worktree-path = "{{ repo_path }}/.worktrees/{{ branch | sanitize }}"

[commit.generation]
command = "CLAUDECODE= MAX_THINKING_TOKENS=0 claude -p --model=haiku --tools='' --disable-slash-commands --setting-sources='' --system-prompt=''"

template = """
Write a concise commit message for these changes. Output ONLY the commit message, nothing else.

<diffstat>
{{ git_diff_stat }}
</diffstat>

<diff>
{{ git_diff }}
</diff>

<context>
Branch: {{ branch }}
{% if recent_commits %}<recent_commits>
{% for commit in recent_commits %}- {{ commit }}
{% endfor %}</recent_commits>{% endif %}
</context>
"""
